name: Daily law admissions monitor

on:
  schedule:
    - cron: '0 1 * * *' # 台灣時間每天 09:00
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Only send SMTP test email (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: admissions-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check official sites and email changes
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADMISSION_YEAR: '116'
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi

      - name: Persist snapshots
        if: always() && inputs.test_email != 'true'
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'chore: update admissions monitoring state'
          git push
